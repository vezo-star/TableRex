# Production-like stack: every component in containers, ASPNETCORE_ENVIRONMENT=Production, one origin behind a reverse
# proxy. Used for release smoke tests and as the reference for a real deployment (docs/DEPLOYMENT.md).
#
#   cp deploy/.env.example deploy/.env      # fill in real values; deploy/.env is git-ignored
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/compose.yml --env-file deploy/.env run --rm migrator bootstrap-admin
#
# In production, PostgreSQL and Redis are usually managed services: drop those two services and point the connection
# strings at them. TLS terminates in front of `proxy` (or in it); PUBLIC_BASE_URL must then be the https origin.
name: bookingplatform-stack

x-postgres: &postgres-connection "Host=postgres;Port=5432;Database=${POSTGRES_DB:-bookingplatform};Username=${POSTGRES_USER:-bookingplatform};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
x-redis: &redis-connection "redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD},abortConnect=false"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookingplatform}
      POSTGRES_USER: ${POSTGRES_USER:-bookingplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Redis holds no authoritative data (rate-limit counters, SignalR backplane), so persistence is off.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "no", "--save", ""]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: ..
      dockerfile: docker/migrator.Dockerfile
    image: ${IMAGE_REGISTRY:-bookingplatform}/migrator:${IMAGE_TAG:-local}
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: *postgres-connection
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: ${IMAGE_REGISTRY:-bookingplatform}/api:${IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: *postgres-connection
      ConnectionStrings__Redis: *redis-connection
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      PublicBooking__TokenKey: ${PUBLIC_BOOKING_TOKEN_KEY:?Set PUBLIC_BOOKING_TOKEN_KEY}
      Cors__AllowedOrigins__0: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      ReverseProxy__TrustedNetworks__0: 10.89.0.0/24
      Payments__Provider: ${PAYMENTS_PROVIDER:-}
      Payments__PublicBaseUrl: ${PUBLIC_BASE_URL}
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    image: ${IMAGE_REGISTRY:-bookingplatform}/worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 35s
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: *postgres-connection
      ConnectionStrings__Redis: *redis-connection
      PublicBooking__TokenKey: ${PUBLIC_BOOKING_TOKEN_KEY:?Set PUBLIC_BOOKING_TOKEN_KEY}
      Notifications__PublicBaseUrl: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      Notifications__Email__Provider: ${MAIL_PROVIDER:-Log}
      Notifications__Email__FromAddress: ${MAIL_FROM_ADDRESS:?Set MAIL_FROM_ADDRESS}
      Notifications__Email__SmtpHost: ${SMTP_HOST:-}
      Notifications__Email__SmtpPort: ${SMTP_PORT:-587}
      Notifications__Email__SmtpEnableSsl: ${SMTP_ENABLE_SSL:-true}
      Notifications__Email__SmtpUsername: ${SMTP_USERNAME:-}
      Notifications__Email__SmtpPassword: ${SMTP_PASSWORD:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: ${IMAGE_REGISTRY:-bookingplatform}/web:${IMAGE_TAG:-local}
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:8080"
    depends_on:
      - api
      - web

networks:
  default:
    ipam:
      config:
        # Fixed so the Api can trust X-Forwarded-For only from this network (ReverseProxy__TrustedNetworks__0).
        - subnet: 10.89.0.0/24

volumes:
  postgres-data:
