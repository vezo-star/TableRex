# Edge reverse proxy: one origin for the SPA and the Api, so the SameSite=Strict refresh cookie and CSP 'self' work.

# Query strings are never logged: SignalR WebSockets carry the access token as ?access_token=.
log_format edge '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                '$request_time "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Re-resolve service names (Docker's embedded DNS) so a recreated container with a new address is picked up
# without restarting the proxy; otherwise every rolling update ends in 502s.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone api 64k;
    server api:8080 resolve;
}

upstream web {
    zone web 64k;
    server web:8080 resolve;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    # Declared here so it replaces the image's default "main" log (which records query strings) instead of adding to it.
    access_log /var/log/nginx/access.log edge;

    location ~ ^/(api|health)(/|$) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This is the edge: overwrite any client-supplied value so rate limits key on the real client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
    }

    location ~ ^/hubs(/|$) {
        # nginx error messages quote the full request line, including ?access_token=, and their format cannot
        # be changed. Upstream failures here are visible through /health/ready and client reconnects instead.
        error_log /dev/stderr crit;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 100s;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
