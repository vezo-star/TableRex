server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Inherited by every location below; do not use add_header inside a location
    # or these are dropped. Quasar sets inline styles at runtime ('unsafe-inline' for styles only).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content-hashed build output.
    location /assets/ {
        try_files $uri =404;
        expires max;
    }

    location = /index.html {
        expires -1;
    }

    # Api-owned paths are routed to the Api by the reverse proxy; never answer them with the SPA.
    location ~ ^/(api|hubs|health)(/|$) {
        return 404;
    }

    # SPA fallback (vue-router history mode).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
