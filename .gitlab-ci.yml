# Booking Platform CI. No secrets in this file: integration tests use throwaway Testcontainers
# credentials, and any future deploy credentials must come from masked/protected CI/CD variables.

stages:
  - build
  - test
  - package
  - e2e

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicate branch + MR pipelines when an MR is open.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  npm_config_cache: $CI_PROJECT_DIR/.npm
  RESULTS_DIR: $CI_PROJECT_DIR/TestResults

# ---------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------

.backend-rules:
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - Backend/**/*
        - database/**/*
        - global.json
        - .gitlab-ci.yml

.frontend-rules:
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - Frontend/**/*
        - .gitlab-ci.yml

.dotnet:
  extends: .backend-rules
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    key:
      prefix: nuget
      files:
        - Backend/Directory.Packages.props
    paths:
      - .nuget/packages/
    policy: pull
  before_script:
    - dotnet --info | head -n 20
    - dotnet restore Backend/BookingPlatform.sln

.dotnet-test-report:
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - TestResults/
    reports:
      junit: TestResults/**/*.xml

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

backend:build:
  extends: .dotnet
  stage: build
  needs: []
  cache:
    policy: pull-push
  script:
    # Directory.Build.props sets TreatWarningsAsErrors.
    - dotnet build Backend/BookingPlatform.sln --configuration Release --no-restore

frontend:build:
  extends: .frontend-rules
  stage: build
  image: node:24-alpine
  needs: []
  cache:
    key:
      prefix: npm
      files:
        - Frontend/BookingPlatform.Web/package-lock.json
    paths:
      - .npm/
  script:
    - cd Frontend/BookingPlatform.Web
    - npm ci
    - npm run lint
    - npm run format:check
    - npm test -- --reporter=default --reporter=junit --outputFile.junit="$RESULTS_DIR/frontend/vitest.xml"
    - npm run build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - Frontend/BookingPlatform.Web/dist/spa/
    reports:
      junit: TestResults/frontend/vitest.xml

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------

backend:unit-tests:
  extends:
    - .dotnet
    - .dotnet-test-report
  stage: test
  needs:
    - job: backend:build
      artifacts: false
  script:
    - >
      dotnet test --project Backend/Tests/BookingPlatform.UnitTests
      --configuration Release --no-restore
      --results-directory "$RESULTS_DIR/unit"
      --report-xunit-junit --report-xunit-junit-filename unit-tests.xml

# Testcontainers needs a Docker daemon: requires a runner that allows privileged docker:dind services.
backend:integration-tests:
  extends:
    - .dotnet
    - .dotnet-test-report
  stage: test
  needs:
    - job: backend:build
      artifacts: false
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - >
      dotnet test --project Backend/Tests/BookingPlatform.IntegrationTests
      --configuration Release --no-restore
      --results-directory "$RESULTS_DIR/integration"
      --report-xunit-junit --report-xunit-junit-filename integration-tests.xml

# ---------------------------------------------------------------------------
# Package: images for deploy/compose.yml (IMAGE_REGISTRY=$CI_REGISTRY_IMAGE, IMAGE_TAG=<sha or tag>)
# ---------------------------------------------------------------------------

package:images:
  stage: package
  image: docker:29
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: backend:unit-tests
      artifacts: false
    - job: backend:integration-tests
      artifacts: false
    - job: frontend:build
      artifacts: false
  parallel:
    matrix:
      - SERVICE: [api, worker, migrator, web]
  before_script:
    # CI_JOB_TOKEN is the short-lived per-job registry credential supplied by GitLab.
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$SERVICE"
    - docker build --pull -f "docker/$SERVICE.Dockerfile" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
      fi

# ---------------------------------------------------------------------------
# E2E: Playwright journeys against a deployed staging environment (never production).
# Needs protected, masked CI/CD variables E2E_BASE_URL, E2E_ADMIN_EMAIL and E2E_ADMIN_PASSWORD
# (a platform admin of that environment). Each run provisions its own tenant.
# ---------------------------------------------------------------------------

e2e:staging:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  needs: []
  rules:
    - if: $E2E_BASE_URL && ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
      when: manual
      allow_failure: true
  cache:
    key:
      prefix: npm
      files:
        - Frontend/BookingPlatform.Web/package-lock.json
    paths:
      - .npm/
    policy: pull
  script:
    - cd Frontend/BookingPlatform.Web
    - npm ci
    - npx playwright test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - Frontend/BookingPlatform.Web/test-results/
    reports:
      junit: Frontend/BookingPlatform.Web/test-results/e2e-junit.xml
